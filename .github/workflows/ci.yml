# CI — baseline completa del workspace Rust.
# CodeQL (codeql.yml) usa build-mode: none e NON compila/testa: questa
# workflow è l'unico gate automatico su push e PR (es. PR di Dependabot).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline (check, test, clippy, fmt, guest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Toolchain (wasm32 + clippy + rustfmt)
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add clippy rustfmt

      # Il guest va buildato PRIMA dei test: GUEST_ECHO_WASM abilita
      # l'e2e reale (guest_echo_e2e), che altrimenti salta silenziosamente.
      - name: Build guest wasm32
        run: cargo build -p guest-echo --target wasm32-unknown-unknown --release

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (e2e reale incluso)
        env:
          GUEST_ECHO_WASM: target/wasm32-unknown-unknown/release/guest_echo.wasm
        run: cargo test -p wasmbox-core

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt
        run: cargo fmt --all --check

  # Benchmark pubblici (2026-10-11): `cargo bench` gira su ogni push a main
  # e il report resta scaricabile come artifact dalla run d'action — così i
  # numeri del README (compile freddo/cache-hit, overhead ask) sono sempre
  # riproducibili e datati dall'ambiente (runner info nel report).
  # Il job NON è un gate: la baseline resta il job sopra.
  benchmark:
    name: Benchmark (cargo bench, artifact pubblico)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: cargo bench (compile freddo/cache, overhead ask)
        run: |
          set -o pipefail
          mkdir -p bench-report
          cargo bench -p wasmbox-core -- --nocapture 2>&1 | \
            tee bench-report/bench-output.txt

      - name: Report con metadati ambiente
        run: |
          {
            echo "# wasmbox benchmark report"
            echo
            echo "- run: ${GITHUB_RUN_ID} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo "- commit: ${GITHUB_SHA}"
            echo "- runner: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
            echo "- comando: cargo bench -p wasmbox-core (harness=false, solo std)"
            echo
            echo '```'
            cat bench-report/bench-output.txt
            echo '```'
          } > bench-report/README.md

      - name: Upload report (artifact pubblico)
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: bench-report/
