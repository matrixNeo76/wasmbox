# GitHub Advanced Security — CodeQL code scanning per il workspace Rust.
# Carica i risultati di code scanning su GitHub (security-events: write).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inizializza CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          build-mode: none

      - name: Esegui le query CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
