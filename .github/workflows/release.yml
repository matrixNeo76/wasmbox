# Release multipiattaforma (v0.6, estesa a v0.9): build dei binari host
# (wasmbox-cli, wasmbox-ui, wasmbox-http, wasmbox-mcp) + la cdylib
# wasmbox-ffi + il guest wasm su 4 OS e pubblicazione della release
# GitHub con un archivio per target-triple.
#
# Trigger: push di tag vX.Y.Z (es. v0.9.0). Per creare una release:
#   git tag v0.9.0 && git push origin v0.9.0
#
# Asset attesi (8, UN archivio per OS con TUTTO il prodotto dentro):
#   wasmbox-<tag>-x86_64-unknown-linux-gnu.tar.gz(.sha256)
#   wasmbox-<tag>-aarch64-apple-darwin.tar.gz(.sha256)
#   wasmbox-<tag>-x86_64-apple-darwin.tar.gz(.sha256)
#   wasmbox-<tag>-x86_64-pc-windows-msvc.zip(.sha256)
#
# Contenuto di ogni archivio (conta ciò che v0.5.1 non includeva):
#   wasmbox-cli, wasmbox-ui, wasmbox-http, wasmbox-mcp   (binari host)
#   libwasmbox_ffi.{so,dylib,dll}                        (C-ABI cdylib,
#     su Windows: wasmbox_ffi.dll)
#   guest_echo.wasm, README.md, LICENSE*
#
# Convenzioni: nomi con target-triple Rust (come ripgrep/fd); .zip su
# Windows, .tar.gz altrove; smoke test CLI+UI+MCP su OGNI runner prima
# dell'upload (la suite completa resta nella CI linux dedicata).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build + release (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            exp: tar.gz
          - os: macos-15
            triple: aarch64-apple-darwin
            exp: tar.gz
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            exp: tar.gz
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            exp: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Il default di rustup sulle runner è già lo stable + l'host target
      # corrispondente al triple della matrice; wasm32 lo aggiungo perché
      # serve per il guest.
      - name: Toolchain (wasm32)
        run: |
          rustup target add wasm32-unknown-unknown
          rustup --version
          cargo --version

      - name: Build guest wasm32
        shell: bash
        run: cargo build -p guest-echo --target wasm32-unknown-unknown --release

      - name: Build release (binari host + cdylib, target esplicito)
        shell: bash
        run: |
          cargo build -p wasmbox-cli -p wasmbox-ui -p wasmbox-http -p wasmbox-mcp -p wasmbox-ffi \
            --release --target ${{ matrix.triple }}

      - name: Fumo CLI (--json su guest reale)
        shell: bash
        run: |
          OUT=$(./target/${{ matrix.triple }}/release/wasmbox-cli run \
            ./target/wasm32-unknown-unknown/release/guest_echo.wasm "smoke" --json)
          echo "$OUT"
          echo "$OUT" | grep -q '.ok.:true'

      - name: Fumo UI (screenshot headless)
        shell: bash
        run: |
          ./target/${{ matrix.triple }}/release/wasmbox-ui --screenshot ui-dim.bmp \
            ./target/wasm32-unknown-unknown/release/guest_echo.wasm "smoke"
          [ "$(head -c 2 ui-dim.bmp)" = "BM" ]

      # Smoke MCP: initialize + tools/list su pipe reali (deterministico,
      # come i test del crate; la notifica non risponde, quindi solo 2 righe).
      - name: Fumo MCP (initialize + tools/list su pipe)
        shell: bash
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./target/${{ matrix.triple }}/release/wasmbox-mcp > mcp-smoke.out 2>/dev/null
          grep -q 'protocolVersion' mcp-smoke.out
          grep -q 'wasmbox_run' mcp-smoke.out

      # Smoke FFI: la cdylib espone wasmbox_engine_new — basta verificare
      # che il file esista ed esporti il simbolo (nm su unix, dumpbin assente
      # su windows: lì contiamo il file, la symbol-check è coperta dai test
      # Rust del crate nella CI linux).
      - name: Fumo FFI (cdylib presente)
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            [ -s "target/${{ matrix.triple }}/release/wasmbox_ffi.dll" ]
          elif [ "$RUNNER_OS" = "macOS" ]; then
            nm -gU "target/${{ matrix.triple }}/release/libwasmbox_ffi.dylib" \
              | grep -q wasmbox_engine_new
          else
            nm -D "target/${{ matrix.triple }}/release/libwasmbox_ffi.so" \
              | grep -q wasmbox_engine_new
          fi

      - name: Pacchetto artefatti (tar.gz)
        if: matrix.exp == 'tar.gz'
        shell: bash
        run: |
          dir=wasmbox-${GITHUB_REF#refs/tags/}-${{ matrix.triple }}
          mkdir -p "$dir"
          # Il nome del dylib FFI cambia per OS: .so su linux, .dylib su macOS.
          if [ "$RUNNER_OS" = "macOS" ]; then
            ffi_lib=libwasmbox_ffi.dylib
          else
            ffi_lib=libwasmbox_ffi.so
          fi
          cp target/${{ matrix.triple }}/release/wasmbox-cli \
             target/${{ matrix.triple }}/release/wasmbox-ui \
             target/${{ matrix.triple }}/release/wasmbox-http \
             target/${{ matrix.triple }}/release/wasmbox-mcp \
             "target/${{ matrix.triple }}/release/$ffi_lib" "$dir/"
          cp target/wasm32-unknown-unknown/release/guest_echo.wasm "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - name: Pacchetto artefatti (zip su Windows)
        if: matrix.exp == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $dir = "wasmbox-$tag-${{ matrix.triple }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/${{ matrix.triple }}/release/wasmbox-cli.exe, `
                     target/${{ matrix.triple }}/release/wasmbox-ui.exe, `
                     target/${{ matrix.triple }}/release/wasmbox-http.exe, `
                     target/${{ matrix.triple }}/release/wasmbox-mcp.exe, `
                     target/${{ matrix.triple }}/release/wasmbox_ffi.dll, `
                     target/wasm32-unknown-unknown/release/guest_echo.wasm, `
                     README.md, LICENSE-MIT, LICENSE-APACHE $dir/
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          $hash = (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dir.zip" | Out-File -Encoding ascii "$dir.zip.sha256"

      - name: Crea release GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            wasmbox-*x86_64-unknown-linux-gnu.tar.gz
            wasmbox-*x86_64-unknown-linux-gnu.tar.gz.sha256
            wasmbox-*aarch64-apple-darwin.tar.gz
            wasmbox-*aarch64-apple-darwin.tar.gz.sha256
            wasmbox-*x86_64-apple-darwin.tar.gz
            wasmbox-*x86_64-apple-darwin.tar.gz.sha256
            wasmbox-*x86_64-pc-windows-msvc.zip
            wasmbox-*x86_64-pc-windows-msvc.zip.sha256
          generate_release_notes: true
