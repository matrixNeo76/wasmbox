[package]
name = "scenario-tool-handler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host dello scenario B: handler con protocollo tool reale sopra ask (dominio nell'host, mai nella sandbox). Feature 'llm' (opt-in): tool llm:<prompt> via OpenRouter."

[dependencies]
wasmbox-core = { path = "../../crates/wasmbox-core" }
ureq = { version = "3.4", optional = true, default-features = false, features = ["rustls"] }

[features]
default = []
llm = ["dep:ureq"]

[[bin]]
name = "scenario-tool-handler"
path = "src/main.rs"
