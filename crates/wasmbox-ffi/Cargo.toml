[package]
name = "wasmbox-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Scenario E (extension-plan §3): C-ABI stabile sopra wasmbox-core per Python/Node/Go/Android/iOS. Zero dipendenze oltre a wasmbox-core; niente thread nel crate; l'output di ogni run è copiato in un buffer malloc-ato."

[lib]
name = "wasmbox_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
wasmbox-core = { path = "../wasmbox-core" }
