[package]
name = "wasmbox-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Server MCP stdio persistente sopra wasmbox-core (piano agent-loop v0.9, docs/agent-loop-plan.md): un solo tool wasmbox_run, envelope JSON compatto capato, modulo compiled-cache per hash. Zero dipendenze oltre al core (JSON-RPC subset scritto a mano, come wasmbox-http)."

[dependencies]
wasmbox-core = { path = "../wasmbox-core" }

[dev-dependencies]
# Solo per i test (stesso guset WAT dei test core); autorizzato dal
# blueprint (dev-dep, non entra in release).
wat = "1"

[lib]
name = "wasmbox_mcp"
path = "src/lib.rs"

[[bin]]
name = "wasmbox-mcp"
path = "src/main.rs"
