[package]
name = "wasmbox-wasi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Layer WASI opt-in per wasmbox: capability deny-by-default sopra wasmbox-core (fuel/epoch/memoria/ask invariati)."
repository = "https://github.com/matrixNeo76/wasmbox"
homepage = "https://github.com/matrixNeo76/wasmbox"
readme = "../../README.md"
keywords = ["wasm", "wasi", "sandbox", "wasmtime", "isolation"]
categories = ["wasm", "os", "development-tools"]

[dependencies]
# Il core NON dipende da wasmtime-wasi: qui sì, e SOLO qui (spec wasi-plan.md §2).
# version: richiesto per `cargo publish`; il path si risolve in locale.
# NOTA crates.io: wasmbox-core non è ancora pubblicato (pendente credito
# utente) — il dry-run fallisce purché la dipendenza non sia online;
# ripeterà OK dopo la pubblicazione di wasmbox-core.
wasmbox-core = { path = "../wasmbox-core", version = "0.1.0" }
thiserror = "2.0"
wasmtime = { version = "49.0", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "pooling-allocator",
    "cache",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "49.0", default-features = false, features = [
    "p1",
] }

[dev-dependencies]
wat = "1"
